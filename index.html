<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDI EXHIBICIONES</title>
    <meta name="color-scheme" content="light dark">
    <!-- FOUC Prevention Script: Set theme before React hydrates -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('app-theme') || 'zafiro';
          document.body.setAttribute('data-theme', savedTheme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
